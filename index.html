<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"Forever Atlas","applicationCategory":"ReferenceApplication","url":"https://benjamh681.github.io/wow-forever-atlas/","description":"Interactive fan-made map of Azeroth for World of Warcraft: Forever, with zone level ranges, new zones and dungeons, transport routes and a route planner.","isAccessibleForFree":true,"operatingSystem":"Any"}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a1422; --surface:#0f1c2f; --surface-2:#15253b; --line:#22354f; --line-2:#2f4766;
  --text:#e7eef8; --muted:#8da2bd; --accent:#3d9bff; --accent-ink:#06121f; --gold:#e0b95a;
  --sea-1:#0e2238; --sea-2:#091626;
  --c-o:#3fb27a; --c-r:#e0a23a; --c-t:#e2665a; --c-c:#7f93ad;
  --sans:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --panel-w:400px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ --bg:#eef2f7; --surface:#ffffff; --surface-2:#f3f6fa; --line:#d5dde8; --line-2:#b9c6d6;
    --text:#0e1a2b; --muted:#566a84; --accent:#1769d1; --accent-ink:#ffffff; --gold:#8a6410;
    --c-o:#1f8a57; --c-r:#a86a06; --c-t:#c23b2e; --c-c:#5b6f89; }
}
:root[data-theme="light"]{ --bg:#eef2f7; --surface:#ffffff; --surface-2:#f3f6fa; --line:#d5dde8; --line-2:#b9c6d6;
  --text:#0e1a2b; --muted:#566a84; --accent:#1769d1; --accent-ink:#ffffff; --gold:#8a6410;
  --c-o:#1f8a57; --c-r:#a86a06; --c-t:#c23b2e; --c-c:#5b6f89; }
:root[data-theme="dark"]{ --bg:#0a1422; --surface:#0f1c2f; --surface-2:#15253b; --line:#22354f; --line-2:#2f4766;
  --text:#e7eef8; --muted:#8da2bd; --accent:#3d9bff; --accent-ink:#06121f; --gold:#e0b95a;
  --c-o:#3fb27a; --c-r:#e0a23a; --c-t:#e2665a; --c-c:#7f93ad; }

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:20px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5;flex:none}
.mark{display:flex;align-items:center;gap:10px;flex:none;text-decoration:none;color:var(--text)}
.mark svg{height:30px;width:30px;display:block}
.mark .t{font-weight:700;font-size:17px;letter-spacing:-.01em;line-height:1.15}
.mark .s{font-size:12.5px;color:var(--muted);line-height:1.2}
.ver{flex:none;margin-left:-8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.ver:hover{border-color:var(--accent);color:var(--text)}
.search{position:relative;flex:1;max-width:400px}
.search input{width:100%;padding:8px 12px 8px 34px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.search input:focus{border-color:var(--accent);outline:none}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;max-height:340px;overflow:auto;box-shadow:0 12px 30px rgba(0,0,0,.35);display:none;z-index:20}
.results.open{display:block}
.results button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;padding:8px 12px;background:none;border:0;cursor:pointer}
.results button[aria-selected="true"],.results button:hover{background:var(--surface-2)}
.results .r-name{font-weight:600}
.results .r-meta{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap}
.results .empty{padding:10px 12px;color:var(--muted)}
.cta{flex:none;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer}
.cta svg{width:16px;height:16px}
.cta:hover{filter:brightness(1.08)}
.tools{display:flex;align-items:center;gap:14px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.lvl{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.lvl input{width:64px;padding:7px 8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;text-align:center;color:var(--text)}
.lvl button{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{background:none;border:0;border-radius:6px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

/* ---------- layout ---------- */
.stage{flex:1;display:flex;min-height:0}
.mapwrap{position:relative;flex:1;min-width:0;overflow:hidden;cursor:grab;touch-action:none;background:radial-gradient(ellipse at 50% 45%,var(--sea-1),var(--sea-2) 80%)}
.mapwrap.drag{cursor:grabbing}
#map{width:100%;height:100%;display:block}
.mapwrap,.mapwrap *{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

.zone{stroke:#081220;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .2s}
.zone:hover{filter:brightness(1.18)}
.zone.is-new{stroke:#e0b95a;stroke-width:2}
.zone.dim{opacity:.22}
.landbase{fill:#132238}
.inner{fill:none;stroke:#000;stroke-opacity:.16;stroke-width:7;vector-effect:non-scaling-stroke;pointer-events:none}
.coast{fill:none;stroke:#6f9bd1;stroke-opacity:.75;stroke-width:1.3;vector-effect:non-scaling-stroke;pointer-events:none}
.surf{fill:none;stroke:#3d7fc4;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round}
.sel{fill:none;stroke:#fff;stroke-width:2.6;vector-effect:non-scaling-stroke;pointer-events:none}
.zlabel{pointer-events:none;text-anchor:middle;font-family:var(--sans);font-weight:600;fill:#f2f6fc;paint-order:stroke;stroke:rgba(6,14,26,.78);stroke-width:3px;stroke-linejoin:round;letter-spacing:.01em}
.zlabel .lv{font-weight:500;font-size:11.5px;fill:#c3d2e6}
.zlabel.dim{opacity:.3}
.sealabel{pointer-events:none;font-family:var(--sans);font-style:italic;font-weight:300;fill:#7fa3cf;opacity:.5;letter-spacing:.3em;text-anchor:middle}
.contlabel{pointer-events:none;font-family:var(--sans);font-weight:300;fill:#9dbbe0;opacity:.42;letter-spacing:.32em;text-anchor:middle}

.route{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;pointer-events:none}
.route.boat{stroke:#a9d2ff;stroke-width:1.6;stroke-dasharray:7 5;opacity:.85}
.route.zep{stroke:#ff9f8c;stroke-width:1.6;stroke-dasharray:2 5;opacity:.85}
.route.tram{stroke:#e7eef8;stroke-width:2;stroke-dasharray:1 4}
.route.is-new{stroke:#e0b95a;stroke-width:2.2;opacity:1}
.route.on{stroke-width:3.6;stroke-dasharray:none;opacity:1}
.route.dimmed{opacity:.14}
.rhit{fill:none;stroke:transparent;stroke-width:14;vector-effect:non-scaling-stroke;cursor:pointer;pointer-events:stroke}

.poi{cursor:pointer}
.poi .plabel{font-family:var(--sans);font-size:12px;font-weight:500;fill:#f2f6fc;paint-order:stroke;stroke:rgba(6,14,26,.85);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.poi.dim{opacity:.2}
.poi .ring{fill:none;stroke:#e0b95a;stroke-width:1.6}
.fpb .plabel{font-size:12px}
.poi .halo{display:none;fill:none;stroke:#fff;stroke-width:2}
.poi.on .halo{display:block}

/* floating map key */
.key{position:absolute;top:12px;left:12px;width:232px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:3;font-size:14px}
.key summary{list-style:none;cursor:pointer;padding:9px 12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.key summary::-webkit-details-marker{display:none}
.key summary::after{content:"+";font-size:17px;line-height:1;color:var(--muted)}
.key[open] summary::after{content:"\2013"}
.key .body{padding:2px 12px 12px;border-top:1px solid var(--line);max-height:calc(100vh - 260px);overflow:auto;scrollbar-color:var(--line-2) transparent}
.key h3{font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.key label{display:flex;align-items:center;gap:8px;padding:2.5px 0;cursor:pointer}
.key label small{color:var(--muted);font-size:12px;display:none}
.key label.idle{color:var(--muted)}
.key label.idle small{display:block;line-height:1.2}
.key input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;flex:none}
.legend div{display:flex;align-items:center;gap:8px;padding:1.5px 0}
.ramp{height:10px;border-radius:5px;background:linear-gradient(90deg,#3fae6a,#b9c24a 33%,#e0a23a 58%,#e0672f 82%,#d13c3c)}
.ramp-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:2px}
.ico{width:18px;height:18px;flex:none}

.zoom{position:absolute;left:12px;bottom:14px;display:flex;flex-direction:column;z-index:3;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.zoom button{width:36px;height:34px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--text);font-size:18px;cursor:pointer}
.zoom button:last-child{border-bottom:0}
.zoom button:hover{background:var(--surface-2)}
.zoom .fit{font-size:12px;font-weight:600}
.compass{position:absolute;right:16px;bottom:14px;width:64px;height:64px;opacity:.8;pointer-events:none;z-index:2}
.tip{position:absolute;pointer-events:none;background:#0a1422;color:#e7eef8;border:1px solid #2f4766;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.35;z-index:6;display:none;max-width:260px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.tip b{font-weight:600}
.tip span{color:#8da2bd}

/* ---------- side panel ---------- */
.panel{width:var(--panel-w);flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--surface);min-height:0;z-index:4}
.tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.tabs button{padding:12px 8px 10px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.sheet{flex:1;overflow:auto;padding:20px 20px 28px;scrollbar-color:var(--line-2) transparent}
.sheet h1{font-size:23px;font-weight:700;letter-spacing:-.015em;line-height:1.2;margin:0 0 2px}
.sheet .where{color:var(--muted);margin:0 0 12px;font-size:14px}
.sheet h2{font-size:13px;font-weight:600;color:var(--muted);margin:24px 0 8px}
.sheet p{margin:0 0 10px;max-width:60ch}
.sheet a{color:var(--accent)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:500}
.pill .dot{width:9px;height:9px;border-radius:50%}
.pill.new{background:none;border-color:var(--gold);color:var(--gold)}
.conf{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap;margin-right:8px}
.conf i{width:7px;height:7px;border-radius:50%;display:inline-block}
.conf.o{color:var(--c-o)} .conf.o i{background:var(--c-o)}
.conf.r{color:var(--c-r)} .conf.r i{background:var(--c-r)}
.conf.t{color:var(--c-t)} .conf.t i{background:var(--c-t)}
.conf.c{color:var(--c-c)} .conf.c i{background:var(--c-c)}
ul.facts{list-style:none;margin:0;padding:0}
ul.facts li{padding:8px 0;border-bottom:1px solid var(--line)}
ul.facts li:last-child{border-bottom:0}
ul.facts li .conf{display:flex;margin:0 0 1px}
.place{display:flex;width:100%;align-items:center;gap:9px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 4px;cursor:pointer;color:var(--text);border-radius:0}
.place:hover{background:var(--surface-2)}
.place .pn{font-weight:500}
.place .pm{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.nw{font-size:11px;font-weight:600;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 5px;line-height:1.5}
.areas{color:var(--muted);font-size:14px}
.routecard{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 8px;cursor:pointer;color:var(--text)}
.routecard:hover,.routecard.on{border-color:var(--accent)}
.routecard .rt{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.routecard .rk{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--muted)}
.routecard .rk .dot{width:8px;height:8px;border-radius:50%}
.routecard .rn{color:var(--muted);font-size:13.5px;margin-top:4px}
.routecard .rn .conf{display:flex;margin:0 0 1px}
.back{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;margin:0 0 10px;font-size:14px}
.lead{font-size:15.5px}
.lead .conf{display:flex;margin:0 0 2px}
.foot{font-size:13px;color:var(--muted);margin-top:22px;border-top:1px solid var(--line);padding-top:12px}


/* patch notes */
.rel{padding:0 0 4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.rel:last-of-type{border-bottom:0}
.rel-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.rel-v{font-weight:700;font-size:15px}
.rel-t{font-weight:600}
.rel-d{color:var(--muted);font-size:13px;margin-left:auto}
.rel ul{list-style:none;margin:0 0 10px;padding:0}
.rel li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:3px 0;font-size:14.5px}
.tag{font-size:11px;font-weight:600;line-height:1.7;text-align:center;border-radius:4px;height:19px;border:1px solid var(--line-2);color:var(--muted)}
.tag.new{color:var(--accent);border-color:var(--accent)}
.tag.fix{color:var(--c-r);border-color:var(--c-r)}
.tag.data{color:var(--c-o);border-color:var(--c-o)}
/* home */
.tryl{font-size:12.5px;font-weight:600;color:var(--muted);margin:26px 0 10px !important}
.chips{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chip{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--accent);background:var(--surface-2)}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sep{height:1px;background:var(--line);margin:32px 0 26px}
.share{display:flex;align-items:center;gap:10px;margin:12px 0 0}
/* route planner */
.seg.wide{display:flex;margin:0 0 8px}
.seg.wide button{flex:1;padding:6px 4px;font-size:13px;white-space:nowrap}
.hint{font-size:13px;color:var(--muted);margin:0 0 14px !important}
.check{display:flex;gap:10px;align-items:flex-start;margin:0 0 20px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px;margin-top:3px;flex:none}
.check span{font-weight:500}
.check small{display:block;font-weight:400;font-size:13px;color:var(--muted);line-height:1.4}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px}
.eta{margin:26px 0 0;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px}
.eta-n{font-size:21px;font-weight:700;letter-spacing:-.01em}
.eta-s{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.45}
.st-m{flex:none;font-weight:500;font-size:13px;color:var(--muted);white-space:nowrap;padding-top:1px}
.planbox{display:grid;gap:12px;margin:0 0 16px}
.planbox .row{display:flex;gap:12px;align-items:center}
.planbox label{font-size:12.5px;font-weight:600;color:var(--muted);width:38px;flex:none}
.planbox input{flex:1;min-width:0;padding:10px 12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.planbox input:focus{border-color:var(--accent);outline:none}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding:9px 6px}
.fromto{display:flex;gap:10px;margin:2px 0 18px}
ol.steps{list-style:none;margin:24px 0 0;padding:0;counter-reset:st}
ol.steps li{position:relative;padding:0 0 24px 38px;counter-increment:st}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
ol.steps li::after{content:"";position:absolute;left:12px;top:28px;bottom:4px;width:1px;background:var(--line-2)}
ol.steps li:last-child::after{display:none}
ol.steps li.end::before{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-t{font-weight:600;line-height:1.35;padding-top:2px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.st-s{color:var(--muted);font-size:13.5px;margin-top:3px}
.st-s .conf{margin:0 0 0 6px}
.warn{display:block;margin-top:7px;line-height:1.4;font-size:13px;color:var(--c-t)}
.warn.soft{color:var(--c-r)}
.planline{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.planline.casing{stroke:#06101d;stroke-width:7}

function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}

  return m?{sec:m,real:true}:{sec:Math.round(dist(a.xy,b.xy)*.78+10),real:false}; }

/* ---------------- view transform ---------------- */
const wrap=$("#wrap"), vp=$("#vp"); let V={k:1,x:0,y:0}, fitK=1, anim=null;
const inset=()=>(innerWidth>=860&&$("#key").open)?250:0;
function calcFit(){ const w=wrap.clientWidth-inset(),h=wrap.clientHeight; return Math.min(w/MW,h/MH)*.98; }
function fitAll(animate){ const L=inset(),w=wrap.clientWidth-L,h=wrap.clientHeight; fitK=calcFit(); to({k:fitK,x:L+(w-MW*fitK)/2,y:(h-MH*fitK)/2},animate); }
function clampV(v){ v.k=Math.max(fitK*.85,Math.min(fitK*14,v.k)); const w=wrap.clientWidth,h=wrap.clientHeight, m=.35;
  v.x=Math.min(w*(1-m), Math.max(w*m-MW*v.k, v.x)); v.y=Math.min(h*(1-m), Math.max(h*m-MH*v.k, v.y)); return v; }
function apply(){ if(typeof placeEnds==="function") placeEnds(); vp.setAttribute("transform",`translate(${V.x.toFixed(2)} ${V.y.toFixed(2)}) scale(${V.k.toFixed(4)})`); restyle(); }
function to(t,animate){ t=clampV(t); if(anim)cancelAnimationFrame(anim);
  if(!animate||matchMedia("(prefers-reduced-motion: reduce)").matches){V=t;apply();return;}
  const s={...V},t0=performance.now(),D=420; (function step(n){const u=Math.min(1,(n-t0)/D),e=1-Math.pow(1-u,3);
    V={k:s.k+(t.k-s.k)*e,x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e};apply(); if(u<1)anim=requestAnimationFrame(step);})(t0); }
function zoomAt(f,cx,cy,animate){ const k=Math.max(fitK*.85,Math.min(fitK*14,V.k*f)), r=k/V.k; to({k,x:cx-(cx-V.x)*r,y:cy-(cy-V.y)*r},animate); }
function focusBox(b,maxRel){ const L=inset(),w=wrap.clientWidth-L,h=wrap.clientHeight, pad=1.9;
  let k=Math.min(w/(b.width*pad+80),h/(b.height*pad+80)); k=Math.max(fitK,Math.min(fitK*(maxRel||5),k));
  to({k,x:L+w/2-(b.x+b.width/2)*k,y:h/2-(b.y+b.height/2)*k},true); }

const TOWN_Z=1.2;
function restyle(){ const k=V.k, rel=k/fitK, inv=1/k, L=state.layers;
  $("#townsLabel").classList.toggle("idle", rel<=TOWN_Z);
  const ls=Math.pow(k,-.62)*1.02;
  for(const id in labelEls){ const g=labelEls[id]; const show=g._size*k>46; g.style.display=show?"":"none";
    if(show) g.setAttribute("transform",`translate(${g._xy[0]} ${g._xy[1]}) scale(${ls.toFixed(3)})`);
    g.lastChild.style.display=L.levels?"":"none"; }
  for(const id in poiEls){ const g=poiEls[id], p=g._p; let show=true;
    if(p.t==="dungeon"||p.t==="raid"||p.t==="bg") show=L.dungeons; else if(p.t==="town"||p.t==="area") show=L.towns&&(rel>TOWN_Z||p.isNew&&rel>1.05);
    else if(p.t==="port") show=L.boats||L.towns; else if(p.t==="zep") show=L.zeps;
    if(L.onlynew&&!p.isNew&&p.t!=="city") show=false;
    if(state.sel&&state.sel.type==="poi"&&state.sel.id===id) show=true;
    if(state.sel&&state.sel.type==="route"){const r=state.sel.r; if([r.from,r.to,...(r.stops||[])].includes(id)) show=true;}
    g.style.display=show?"":"none"; if(!show) continue;
    let mb=Math.min(1.25,Math.max(.72,.62+rel*.16)); const vw=Math.min(1,wrap.clientWidth/800); if(vw<1) mb*=Math.min(1,vw+(rel-1)*.35); const ms=inv*mb;
    g.setAttribute("transform",`translate(${p.xy[0]} ${p.xy[1]}) scale(${ms.toFixed(4)})`);
    const lab=g.querySelector(".plabel"); const big=p.t==="city"; lab.style.display=(big&&rel>1.25)||rel>2.6||g.classList.contains("on")?"":"none"; }
  const planFp=new Set(plan&&plan.res&&plan.res.ok&&state.tab==="plan"?plan.res.fps:[]);
  for(const id in flightEls){ const g=flightEls[id], p=g._p; const show=L.flights||planFp.has(id); g.style.display=show?"":"none"; if(!show) continue;
    let mb=Math.min(1.25,Math.max(.72,.62+rel*.16)); const vw=Math.min(1,wrap.clientWidth/800); if(vw<1) mb*=Math.min(1,vw+(rel-1)*.35);
    g.setAttribute("transform",`translate(${p.xy[0]} ${p.xy[1]}) scale(${(inv*mb).toFixed(4)})`);
    const under=poiEls[id].style.display!=="none"&&poiEls[id].querySelector(".plabel").style.display!=="none"; g.querySelector(".plabel").style.display=(!under&&(rel>1.9||planFp.has(id)))?"":"none"; }
  ROUTES.forEach(r=>{ let show=r.kind==="boat"?L.boats:L.zeps; if(L.onlynew&&!r.isNew) show=false; if(state.sel&&state.sel.type==="route"&&state.sel.r===r) show=true; routeEls[r.id].style.display=show?"":"none"; });
}

function flightSection(p){ const facs=p.fp==="both"?["alliance","horde"]:[p.fp];

function renderAbout(){ sheet.innerHTML=`<h1>About this map</h1><p class="where">Version ${CHANGELOG[0].v}, updated ${CHANGELOG[0].d}</p>
   <h2 id="notes">Patch notes</h2>${CHANGELOG.map(r=>`<div class="rel"><div class="rel-h"><span class="rel-v">v${r.v}</span><span class="rel-t">${esc(r.title)}</span><span class="rel-d">${r.d}</span></div><ul>${r.items.map(([k,m])=>`<li><span class="tag ${k}">${k}</span><span>${esc(m)}</span></li>`).join("")}</ul></div>`).join("")}
   <h2>Sources and confidence</h2><p class="lead">This is a fan-made atlas, assembled from public information since September 17, 2026, the day the beta opened, and corrected along the way with feedback from r/wowforever. Much of it will change.</p>
   <h2>How to read the labels</h2><ul class="facts">${Object.entries(CONF).map(([k,v])=>`<li>${seal(k)}${esc(v[1])}.</li>`).join("")}</ul>
   <h2>About the map itself</h2><p>The continents are redrawn by hand in the spirit of the Classic world map. They are not traced from game files. Borders of the new zones, the position of new dungeons and every sea lane are approximations. Zephras Isle lies in Skywall; it is drawn in the Great Sea so it has somewhere to live.</p>
   <h2>About travel times</h2><p>A hand-drawn map has no scale, so one was measured. Flights move at a constant speed, and the Classic community has timed hundreds of them. Laying 291 of those timings over this map gave the same scale on both continents, within 2%. Walking and riding times are that scale converted to run speed, with a margin for winding roads. Expect them to be right within a quarter, not to the second.</p>
   <p>Flight times are the measured Classic ones where they exist. Ships and zeppelins count two minutes on board plus up to five of waiting. Mount speeds come from datamining and are labelled Reported. If you time a trip in the beta and the planner is off, say so: the scale is one number and easy to correct.</p>
   <h2>Sources</h2><ul class="facts">${SOURCES.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a></li>`).join("")}</ul>
   <p class="foot">Unofficial fan project, not affiliated with or endorsed by Blizzard Entertainment. World of Warcraft, Warcraft and all related names are trademarks of Blizzard Entertainment, Inc. Spotted a mistake? That is what the comments are for.</p>`; }

const norm=s=>s.toLowerCase().replace(/[\u2019'`]/g,"'");
/* ---------------- route planner ---------------- */
const GATES=GEO.gates||{};
const NODE_POIS=POIS.filter(p=>["city","port","zep"].includes(p.t)||p.fp);
const plan={f:"alliance",from:"",to:"",res:null,speed:"foot",auto:true,fp:false};
const SPEEDS={foot:["On foot",1],form:["Travel form",1.4],m60:["Mount 60%",1.6],m100:["Mount 100%",2]};
try{const sv=JSON.parse(localStorage.getItem("fa-plan")||"{}"); if(sv.f==="horde"||sv.f==="alliance") plan.f=sv.f; if(SPEEDS[sv.speed]){plan.speed=sv.speed;plan.auto=false;} plan.fp=!!sv.fp;}catch(e){}
const savePlan=()=>{try{localStorage.setItem("fa-plan",JSON.stringify({f:plan.f,speed:plan.auto?null:plan.speed,fp:plan.fp}))}catch(e){}};
/* Scale: 291 real Classic flight durations give 0.76 s per map unit in the air, the same on both continents.
   At roughly 25 yd/s effective flight speed that is about 19 yards per map unit. Running is 7 yd/s, roads wind about 15%. */
const FOOT_SPU=19*1.15/7;
const autoSpeed=()=>state.level>=60?"m100":state.level>=40?"m60":"foot";
const spu=()=>FOOT_SPU/SPEEDS[plan.speed][1];
const RIDE={boat:[120,0,300],zep:[120,0,300],ferry:[90,0,180],tram:[75,0,90]}; /* seconds on board, min wait, max wait */
const rideOf=r=>RIDE[r.kind==="tram"?"tram":(r.id==="r-aub-rut"||r.id==="r-fea-for")?"ferry":r.kind];

const zc=id=>[GEO.zones[id].cx,GEO.zones[id].cy];
function fmtMin(s){ const m=Math.round(s/60); if(m<1) return "under 1 min"; if(m<60) return m+" min"; return Math.floor(m/60)+" h "+String(m%60).padStart(2,"0"); }
const PLACES={};
Object.values(ZONES).forEach(z=>{ if(GEO.zones[z.id]) PLACES[norm(z.name)]={type:"zone",id:z.id,name:z.name}; });
POIS.forEach(p=>{ PLACES[norm(p.n)]={type:"poi",id:p.id,name:p.n}; });
$("#places").innerHTML=Object.values(PLACES).map(p=>`<option value="${esc(p.name)}">`).join("");
const fromTo=n=>`<div class="fromto"><button class="btn" data-planfrom="${esc(n)}">Route from here</button><button class="btn" data-planto="${esc(n)}">Route to here</button></div>`;
const foe=f=>f==="alliance"?"horde":"alliance";
const EXAMPLES=[["Darnassus","Ironforge","alliance"],["Orgrimmar","Riverglades","horde"],["Auberdine","Mount Hyjal","alliance"],["Gadgetzan","Krol'dok Stronghold","horde"]];

function buildGraph(f,strict,landK){ const A={}; const add=(a,b,w,e)=>{(A[a]=A[a]||[]).push({to:b,w,e});(A[b]=A[b]||[]).push({to:a,w,e});};
  const S=spu();
  LAND_EDGES.forEach(([a,b,via,c,note])=>{ const g=GATES[a+"|"+b]||zc(b); add("z:"+a,"z:"+b,(dist(zc(a),g)+dist(g,zc(b)))*S*landK,{k:"land",a,b,via,c,note}); });
  NODE_POIS.forEach(p=>{ if(p.id!=="feathermoon") add("p:"+p.id,"z:"+p.z,Math.max(30,dist(p.xy,zc(p.z))*S*.6),{k:"in"}); }); /* Feathermoon sits on an island: ferry only */
  CITY_LINKS.forEach(([a,b,via,fixed,verb])=>add("p:"+a,"p:"+b,fixed||(dist(POI[a].xy,POI[b].xy)*S+30),{k:"link",via,fixed,verb}));
  if(plan.fp){ const fm=POIS.filter(p=>p.fp&&(p.fp==="both"||p.fp===f)); for(let i=0;i<fm.length;i++) for(let j=i+1;j<fm.length;j++) if(contOf(fm[i])===contOf(fm[j])){ const ft=flightTime(f,fm[i],fm[j]); add("p:"+fm[i].id,"p:"+fm[j].id,ft.sec+25,{k:"fly",ft}); } }
  ROUTES.forEach(r=>{ const ok=r.f==="neutral"||r.f===f; if(strict&&!ok) return; const stops=[r.from,...(r.stops||[]),r.to];
    for(let i=0;i<stops.length-1;i++) { const rd=rideOf(r); add("p:"+stops[i],"p:"+stops[i+1],rd[0]+(rd[1]+rd[2])/2+(ok?0:1800),{k:"ride",r,ok}); } });
  return A; }
function shortest(A,src,dst,f){ const D={[src]:0},P={},done=new Set();
  while(true){ let u=null; for(const n in D) if(!done.has(n)&&(u===null||D[n]<D[u])) u=n; if(u===null) return null; if(u===dst) break; done.add(u);
    (A[u]||[]).forEach(({to,w,e})=>{ let c=D[u]+w; if(to[0]==="z"&&ZONES[to.slice(2)].faction===foe(f)) c+=600; if(!(to in D)||c<D[to]){D[to]=c;P[to]={u,e};} }); }
  const nodes=[dst],edges=[]; let n=dst; while(n!==src){edges.unshift(P[n].e);n=P[n].u;nodes.unshift(n);} return {nodes,edges}; }
function nodeOf(pl){ if(pl.type==="zone") return GEO.zones[pl.id]&&ZONES[pl.id].status!=="closed"?"z:"+pl.id:null;
  const p=POI[pl.id]; if(NODE_POIS.includes(p)) return "p:"+p.id; return p.z?"z:"+p.z:null; }
const nodeName=n=>n[0]==="z"?ZONES[n.slice(2)].name:POI[n.slice(2)].n;
const nodeXY=n=>n[0]==="z"?[GEO.zones[n.slice(2)].cx,GEO.zones[n.slice(2)].cy]:POI[n.slice(2)].xy;
const placeXY=pl=>pl.type==="zone"?[GEO.zones[pl.id].cx,GEO.zones[pl.id].cy]:POI[pl.id].xy;

function computePlan(){ const a=PLACES[norm(plan.from.trim())], b=PLACES[norm(plan.to.trim())];
  if(!a||!b) return {ok:false,msg:!a&&plan.from?`"${plan.from}" is not on the map. Pick a name from the suggestions.`:!b&&plan.to?`"${plan.to}" is not on the map. Pick a name from the suggestions.`:""};
  const na=nodeOf(a), nb=nodeOf(b);
  const dead=pl=>pl.type==="zone"&&ZONES[pl.id].status==="closed"?`${pl.name} is not accessible in Forever.`:pl.type==="poi"&&!POI[pl.id].z?`${pl.name} is instanced. You queue for it, you don't walk there.`:null;
  if(!na||!nb) return {ok:false,msg:dead(!na?a:b)||"No route."};
  if(a.id===b.id&&a.type===b.type) return {ok:false,msg:"That's the same place."};
  /* Graph weights hop between zone centres, which overstates walking. Try three weightings and keep the route whose real estimate is lowest. */
  let cands=[], forced=false; const seen=new Set();
  const gather=strict=>[1,.75,.55].forEach(k=>{ const p=shortest(buildGraph(plan.f,strict,k),na,nb,plan.f); if(p&&!seen.has(p.nodes.join(">"))){seen.add(p.nodes.join(">"));cands.push(p);} });
  gather(true); if(!cands.length){ gather(false); forced=true; }
  let path=cands[0];
  if(!path){ const zid=[a,b].map(pl=>pl.type==="zone"?pl.id:POI[pl.id].z).find(z=>z==="zephras");
    return {ok:false,msg:zid?"No known way in or out of Zephras Isle yet. Where Skyborne arrive on Azeroth after level 12 has not been announced.":"No known route between these two places."}; }
  const built=cands.map(p=>buildPlan(p,a,b,forced)); built.sort((x,y)=>x.time.score-y.time.score); return built[0]; }
function buildPlan(path,a,b,forced){
  const F=plan.f, steps=[], zones=new Set(), segs=[], fps=[]; let cur=[placeXY(a)];
  const S=spu(); let prevPt=placeXY(a), pend=0; const leg=pt=>{ const s=dist(prevPt,pt)*S; prevPt=pt; return s; };
  const take=x=>{ const s=x+pend; pend=0; return s; };
  const zwarn=z=>{ const w=[]; if(z.faction===foe(F)) w.push([`${FSHORT[z.faction]} territory: guards and players will attack you.`,""]);
    if(state.level!=null&&z.lv&&z.lv[0]>state.level+3) w.push([`Level ${lvText(z)} zone. At ${state.level} the mobs here will be well above you.`,"soft"]); return w; };
  const sz=a.type==="zone"?a.id:POI[a.id].z; zones.add(sz);
  steps.push({t:`Start in ${a.name}`,s:a.type==="poi"?`${TNAME[POI[a.id].t]} in ${ZONES[sz].name}`:`Level ${lvText(ZONES[sz])}`,w:zwarn(ZONES[sz])});
  path.edges.forEach((e,i)=>{ const u=path.nodes[i], v=path.nodes[i+1], last=i===path.edges.length-1;
    if(e.k==="land"){ const z=ZONES[v.slice(2)]; zones.add(z.id); const w=zwarn(z); if(e.note) w.push([e.note,"soft"]);
      const gp=GATES[e.a+"|"+e.b]||GATES[e.b+"|"+e.a]||nodeXY(v); cur.push(gp); steps.push({t:`Cross into ${z.name}`,s:`Through ${e.via}${z.lv?" · level "+lvText(z):""}`,c:e.c!=="c"?e.c:null,w,sec:take(leg(gp))}); }
    else if(e.k==="in"){ if(v[0]==="p"){ cur.push(nodeXY(v)); const s=leg(nodeXY(v)); if(!last) steps.push({t:`Make your way to ${nodeName(v)}`,s:`${TNAME[POI[v.slice(2)].t]} in ${ZONES[POI[v.slice(2)].z].name}`,w:[],sec:take(s)}); else pend+=s; } else zones.add(v.slice(2)); }
    else if(e.k==="fly"){ const A=POI[u.slice(2)], B=POI[v.slice(2)]; if(cur.length>1) segs.push({k:"land",pts:cur}); segs.push({k:"air",pts:[A.xy,B.xy]}); cur=[B.xy]; prevPt=B.xy; zones.add(B.z); fps.push(A.id,B.id);
      steps.push({t:`Fly from ${A.n} to ${B.n}`,s:e.ft.real?"Flight path · time measured in Classic":"Flight path · estimated time",w:zwarn(ZONES[B.z]),sec:take(0)+e.ft.sec,fix:e.ft.sec}); }
    else if(e.k==="link"){ cur.push(nodeXY(v)); const walked=leg(nodeXY(v)), s=e.fixed||Math.max(30,walked); if(!last) steps.push({t:`${e.verb||"Walk to"} ${nodeName(v)}`,s:`Through ${e.via}`,w:[],sec:take(s),fix:e.fixed||0}); else pend+=s; }
    else { const r=e.r, ia=r.pts.indexOf(POI[u.slice(2)].xy), ib=r.pts.indexOf(POI[v.slice(2)].xy); let pts=r.pts.slice(Math.min(ia,ib),Math.max(ia,ib)+1); if(ia>ib) pts=pts.reverse();
      if(cur.length>1) segs.push({k:"land",pts:cur}); segs.push({k:r.kind==="tram"?"land":"sea",pts}); cur=[POI[v.slice(2)].xy]; zones.add(POI[v.slice(2)].z);
      const w=zwarn(ZONES[POI[v.slice(2)].z]); if(!e.ok) w.push([`${FSHORT[r.f]} ports. Their guards will attack you on the docks. There is no ${FSHORT[F]} alternative.`,""]);
      if(r.stops&&r.stops.length) w.push(["Stop order on this line is not confirmed yet.","soft"]);
      const rd=rideOf(r); prevPt=POI[v.slice(2)].xy; steps.push({t:`${kindName(r)} from ${nodeName(u)} to ${nodeName(v)}`,s:r.isNew?"New in Forever":"Classic route",c:r.c!=="c"?r.c:null,w,ride:rd,sec:take(0)}); } });
  const ez=b.type==="zone"?b.id:POI[b.id].z; zones.add(ez); cur.push(placeXY(b)); if(cur.length>1) segs.push({k:"land",pts:cur});
  const ew=[]; if(b.type==="poi"&&POI[b.id].f===foe(F)) ew.push([`${FSHORT[POI[b.id].f]} ${POI[b.id].t==="city"?"capital":"town"}. You will not be welcome.`,""]);
  const lastS=steps[steps.length-1], fin=take(leg(placeXY(b)));
  if(b.type==="zone"&&lastS.t===`Cross into ${b.name}`){ lastS.end=true; lastS.sec=(lastS.sec||0)+fin; }
  else steps.push({sec:fin,t:`Arrive at ${b.name}`,s:(path.edges.length===0?"Same zone, just follow the roads · ":"")+(b.type==="poi"?`${TNAME[POI[b.id].t]} in ${ZONES[ez].name}`:`Level ${lvText(ZONES[ez])}`),w:ew,end:true});
  let land=0,fixed=0,rmin=0,rmax=0; steps.forEach(s=>{ const fx=Math.min(s.fix||0,s.sec||0); fixed+=fx; land+=(s.sec||0)-fx; if(s.ride){rmin+=s.ride[0]+s.ride[1]; rmax+=s.ride[0]+s.ride[2];} });
  const hostile=[...zones].filter(z=>ZONES[z]&&ZONES[z].faction===foe(F)).length;
  const time={mid:land+fixed+(rmin+rmax)/2,lo:land*.8+fixed+rmin,hi:land*1.25+fixed+rmax,rides:rmax>0,score:land+fixed+(rmin+rmax)/2+hostile*600};
  return {ok:true,steps,zones,segs,forced,time,fps}; }

function arc(a,b){ const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,d=dist(a,b)||1; let nx=-(b[1]-a[1])/d,ny=(b[0]-a[0])/d; if(ny>0){nx=-nx;ny=-ny;} return [a,[mx+nx*d*.13,my+ny*d*.13],b]; }
function drawPlan(){ const g=$("#gPlan"); g.innerHTML=""; const on=!!(plan.res&&plan.res.ok&&state.tab==="plan"); ROUTES.forEach(r=>r.line.classList.toggle("dimmed",on)); if(!on) return;
  plan.res.segs.forEach(sg=>{ if(sg.k==="air") sg.pts=sg.pts.length===2?arc(sg.pts[0],sg.pts[1]):sg.pts; el("path",{d:spline(sg.pts),class:"planline casing"},g); });
  plan.res.segs.forEach(sg=>{ el("path",{d:spline(sg.pts),class:"planline "+sg.k},g); });
  const all=plan.res.segs.flatMap(sg=>sg.pts), A=all[0], B=all[all.length-1];
  plan.ends=[el("circle",{class:"planend",r:6,fill:"#3fb27a",stroke:"#06101d","stroke-width":2},g),el("circle",{class:"planend",r:6,fill:"#fff",stroke:"#06101d","stroke-width":2},g)];
  plan.ends[0]._xy=A; plan.ends[1]._xy=B; placeEnds(); }
function placeEnds(){ (plan.ends||[]).forEach(c=>{ if(c.isConnected) c.setAttribute("transform",`translate(${c._xy[0]} ${c._xy[1]}) scale(${(1/V.k).toFixed(4)})`); }); }
function fitPlan(){ const all=plan.res.segs.flatMap(sg=>sg.pts), xs=all.map(p=>p[0]), ys=all.map(p=>p[1]); const b={x:Math.min(...xs),y:Math.min(...ys)}; b.width=Math.max(...xs)-b.x; b.height=Math.max(...ys)-b.y;
  const L=inset(),w=wrap.clientWidth-L,h=wrap.clientHeight; let k=Math.min(w/(b.width*1.15+120),h/(b.height*1.15+120)); k=Math.max(fitK*.9,Math.min(fitK*5,k)); to({k,x:L+w/2-(b.x+b.width/2)*k,y:h/2-(b.y+b.height/2)*k},true); }
function readPlanInputs(){ const f=$("#planFrom"),t=$("#planTo"); if(f) plan.from=f.value; if(t) plan.to=t.value; }
function planHash(){ const q=new URLSearchParams({from:plan.from,to:plan.to,f:plan.f,by:plan.speed}); if(plan.fp) q.set("fp","1"); return "#"+q.toString(); }
function syncHash(){ try{ history.replaceState(null,"",plan.res&&plan.res.ok&&state.tab==="plan"?planHash():location.pathname+location.search); }catch(e){} }
function loadHash(){ if(location.hash.length<2) return false; const q=new URLSearchParams(location.hash.slice(1)); if(!q.get("from")||!q.get("to")) return false;
  plan.from=q.get("from"); plan.to=q.get("to"); if(q.get("f")==="horde"||q.get("f")==="alliance") plan.f=q.get("f"); if(SPEEDS[q.get("by")]){plan.speed=q.get("by");plan.auto=false;} plan.fp=q.get("fp")==="1"; return true; }
function runPlan(){ plan.res=(plan.from&&plan.to)?computePlan():null; clearMarks(); state.sel=null; state.tab="plan"; render(); drawPlan(); paint(); restyle(); if(plan.res&&plan.res.ok) fitPlan(); syncHash(); }
function openPlan(){ state.tab="plan"; runPlan(); }

function renderPlan(){ const r=plan.res;
  sheet.innerHTML=`<h1>Route planner</h1><p class="where" style="margin-bottom:20px">How do I get from here to there?</p>
   <div class="seg" role="group" aria-label="Your faction" style="display:inline-flex;margin:0 0 20px"><button data-pf="alliance" aria-pressed="${plan.f==="alliance"}">Alliance</button><button data-pf="horde" aria-pressed="${plan.f==="horde"}">Horde</button></div>
   <div class="seg wide" role="group" aria-label="How you travel on land">${Object.entries(SPEEDS).map(([k,v])=>`<button data-ps="${k}" aria-pressed="${plan.speed===k}">${v[0]}</button>`).join("")}</div>
   <p class="hint">${plan.auto?(state.level!=null?`Picked from your level (${state.level}). Change it if you ride something else.`:"Type your level in the top bar and this picks itself."):"Your choice. "}${plan.auto?"":'<button class="linkish" data-ps="auto">Back to automatic</button>'}</p>
   <label class="check"><input type="checkbox" id="planFp" ${plan.fp?"checked":""}><span>I have the flight paths<small>Off by default: a new character has to reach each flight master on foot first.</small></span></label>
   <div class="planbox"><div class="row"><label for="planFrom">From</label><input id="planFrom" list="places" value="${esc(plan.from)}" placeholder="Zone, town, dungeon or port" autocomplete="off"></div>
   <div class="row"><label for="planTo">To</label><input id="planTo" list="places" value="${esc(plan.to)}" placeholder="Zone, town, dungeon or port" autocomplete="off"></div></div>
   <div class="row" style="display:flex;gap:8px;align-items:center"><button class="btn primary" id="planGo">Find route</button><button class="btn" id="planSwap">Swap</button>${plan.from||plan.to?'<button class="btn ghost" id="planClear">Clear</button>':""}</div>
   ${!r?`<h2>How it works</h2><ul class="facts"><li>Pick two places, or select something on the map and use "Route from here" and "Route to here".</li><li>The planner chains roads, ships, zeppelins and the tram for your faction, and avoids enemy territory when it can.</li><li>Tick "I have the flight paths" once you have discovered them, and the planner will fly you where it is faster.</li><li>You get a time estimate for the way you travel: on foot, in travel form, or on a 60% or 100% mount.</li><li>Type your level in the top bar: it picks your mount for you and warns you when the route crosses zones above you.</li></ul>`
     :!r.ok?(r.msg?`<p class="warn" style="margin-top:14px;font-size:15px">${esc(r.msg)}</p>`:"")
     :`${r.forced?`<p class="warn" style="margin-top:14px;font-size:14px">There is no ${FSHORT[plan.f]}-friendly way to make this trip. This route uses enemy transport.</p>`:""}
       <div class="eta"><div class="eta-n">About ${fmtMin(r.time.mid)}</div><div class="eta-s">${[fmtMin(r.time.lo)!==fmtMin(r.time.hi)?`Between ${fmtMin(r.time.lo)} and ${fmtMin(r.time.hi)}`:"",r.steps.some(s=>s.sec>20&&!s.fix&&!s.ride)?SPEEDS[plan.speed][0].toLowerCase():"",plan.fp?"with flight paths":"no flight paths",r.time.rides?"depends on how long you wait for transport":""].filter(Boolean).join(" · ")}</div></div>
       <div class="share"><button class="btn" id="planCopy">Copy link to this route</button></div>
       <ol class="steps">${r.steps.map(s=>`<li class="${s.end?"end":""}"><div class="st-t">${esc(s.t)}<span class="st-m">${s.ride?fmtMin(s.ride[0]+s.ride[1]).replace(" min","")+"\u2013"+fmtMin(s.ride[0]+s.ride[2]):(s.sec>20?"\u2248 "+fmtMin(s.sec):"")}</span></div><div class="st-s">${esc(s.s)}${s.c?seal(s.c):""}</div>${s.w.map(([m,k])=>`<span class="warn ${k}">${esc(m)}</span>`).join("")}</li>`).join("")}</ol>
       <p class="foot">Times are estimates, give or take a quarter. The map is drawn by hand; its scale was set against 291 real Classic flight durations, then converted to running speed. Ships and zeppelins count up to five minutes of waiting. Mount speeds (60% at level 40, 100% at level 60) come from datamining, not from Blizzard. Flight times come from measurements made in Classic; where a pair was never measured, the time is estimated from distance and says so. Forever has announced no change to flight paths, and the new zones' flight masters are not known yet. New-zone links are as reliable as their label says.</p>`}`; }

/* ---------------- selection ---------------- */
function clearMarks(){ selPath.setAttribute("d",""); $$(".poi.on").forEach(e=>e.classList.remove("on")); ROUTES.forEach(r=>{r.line.classList.remove("on","dimmed");}); }
function select(s,opts={}){ clearMarks(); state.sel=s; if(s) state.tab=opts.keepTab?state.tab:"details";
  if(s&&s.type==="zone"){ selPath.setAttribute("d",GEO.zones[s.id].d); if(opts.focus!==false) focusBox(zoneEls[s.id].getBBox(),4.5); }
  if(s&&s.type==="poi"){ const p=POI[s.id]; poiEls[s.id].classList.add("on"); if(p.z) selPath.setAttribute("d",GEO.zones[p.z].d);
    if(opts.focus!==false) focusBox({x:p.xy[0]-60,y:p.xy[1]-60,width:120,height:120},6); }
  if(s&&s.type==="route"){ ROUTES.forEach(r=>r.line.classList.toggle("dimmed",r!==s.r)); s.r.line.classList.add("on"); [s.r.from,s.r.to,...(s.r.stops||[])].forEach(id=>poiEls[id].classList.add("on"));
    if(opts.focus!==false){const xs=s.r.pts.map(p=>p[0]),ys=s.r.pts.map(p=>p[1]);const b={x:Math.min(...xs),y:Math.min(...ys)};b.width=Math.max(...xs)-b.x;b.height=Math.max(...ys)-b.y;
      const L=inset(),w=wrap.clientWidth-L,h=wrap.clientHeight;let k=Math.min(w/(b.width*1.12+60),h/(b.height*1.12+60));k=Math.max(fitK*.9,Math.min(fitK*6,k));to({k,x:L+w/2-(b.x+b.width/2)*k,y:h/2-(b.y+b.height/2)*k},true);} }
  restyle(); render(); }

/* ---------------- events ---------------- */
const tip=$("#tip"); let moved=false;
function showTip(html,ev){ tip.innerHTML=html; tip.style.display="block"; const r=wrap.getBoundingClientRect(); let x=ev.clientX-r.left+14,y=ev.clientY-r.top+16;
  if(x+tip.offsetWidth>r.width-8) x=ev.clientX-r.left-tip.offsetWidth-10; if(y+tip.offsetHeight>r.height-8) y=ev.clientY-r.top-tip.offsetHeight-10; tip.style.left=x+"px"; tip.style.top=y+"px"; }
$("#map").addEventListener("pointermove",ev=>{ if(ptrs.size) {tip.style.display="none";return;} const t=ev.target, pg=t.closest(".poi");
  if(pg){const p=pg._p; if(pg.classList.contains("fpb")) showTip(`<b>${esc(p.n)}</b><br><span>${FPNAME[p.fp]}</span>`,ev); else showTip(`<b>${esc(p.n)}</b><br><span>${TNAME[p.t]}${p.lv?", level "+(p.lv[0]===p.lv[1]?p.lv[0]:p.lv[0]+"\u2013"+p.lv[1]):""}${p.isNew?"<br>New in Forever":""}</span>`,ev);}
  else if(t._r){showTip(`<b>${esc(routeTitle(t._r))}</b><br><span>${kindName(t._r)}${t._r.isNew?", new in Forever":""}</span>`,ev);}
  else if(t.dataset&&t.dataset.z){const z=ZONES[t.dataset.z]; showTip(`<b>${esc(z.name)}</b><br><span>${z.lv?"Level "+lvText(z):(z.status==="closed"?"Not accessible":"Level range unknown")} \u00b7 ${FSHORT[z.faction]||"Closed"}${z.status==="new"?"<br>New in Forever":""}</span>`,ev);}
  else tip.style.display="none"; });
$("#map").addEventListener("pointerleave",()=>tip.style.display="none");
function activate(t){ const pg=t.closest&&t.closest(".poi"); if(pg) return select({type:"poi",id:pg._p.id},{focus:false});
  if(t._r) return select({type:"route",r:t._r},{focus:false}); if(t.dataset&&t.dataset.z) return select({type:"zone",id:t.dataset.z},{focus:false}); select(null,{keepTab:true}); }
$("#map").addEventListener("click",ev=>{ if(moved) return; activate(ev.target); });
$("#map").addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();activate(ev.target);} });
$("#map").addEventListener("dblclick",ev=>{const r=wrap.getBoundingClientRect();zoomAt(1.8,ev.clientX-r.left,ev.clientY-r.top,true);});

const ptrs=new Map(); let last=null, pinch=0;
wrap.addEventListener("pointerdown",ev=>{ if(ev.target.closest(".key,.zoom")) return; ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]); moved=false; last=[ev.clientX,ev.clientY];
  if(ptrs.size===2){const a=[...ptrs.values()];pinch=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);} });
wrap.addEventListener("pointermove",ev=>{ if(!ptrs.has(ev.pointerId)) return; ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);
  if(ptrs.size===1){ const dx=ev.clientX-last[0],dy=ev.clientY-last[1]; if(!moved&&Math.hypot(dx,dy)<4) return; if(!moved){moved=true;wrap.classList.add("drag");try{wrap.setPointerCapture(ev.pointerId)}catch(e){}}
    last=[ev.clientX,ev.clientY]; if(anim)cancelAnimationFrame(anim); V=clampV({k:V.k,x:V.x+dx,y:V.y+dy}); apply(); }
  else if(ptrs.size===2){ moved=true; const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),r=wrap.getBoundingClientRect();
    if(pinch) zoomAt(d/pinch,(a[0][0]+a[1][0])/2-r.left,(a[0][1]+a[1][1])/2-r.top,false); pinch=d; } });
const up=ev=>{ptrs.delete(ev.pointerId); wrap.classList.remove("drag"); if(ptrs.size<2)pinch=0; if(ptrs.size===1)last=[...ptrs.values()][0]; setTimeout(()=>{if(!ptrs.size)moved=false;},0);};
wrap.addEventListener("pointerup",up); wrap.addEventListener("pointercancel",up);
wrap.addEventListener("selectstart",ev=>ev.preventDefault());
wrap.addEventListener("dragstart",ev=>ev.preventDefault());
wrap.addEventListener("wheel",ev=>{ if(ev.target.closest(".key")) return; ev.preventDefault(); const r=wrap.getBoundingClientRect(); zoomAt(Math.exp(-ev.deltaY*(ev.ctrlKey?.01:.0016)),ev.clientX-r.left,ev.clientY-r.top,false); },{passive:false});
$("#zin").onclick=()=>zoomAt(1.6,wrap.clientWidth/2,wrap.clientHeight/2,true);
$("#zout").onclick=()=>zoomAt(1/1.6,wrap.clientWidth/2,wrap.clientHeight/2,true);
$("#zfit").onclick=()=>fitAll(true);
$("#planCta").onclick=()=>{state.tab="plan";clearMarks();state.sel=null;render();drawPlan();paint();restyle();const f=$("#planFrom");if(f&&!plan.from)f.focus();};
$("#ver").textContent="v"+CHANGELOG[0].v; $("#ver").onclick=()=>{state.tab="about";render();drawPlan();paint();};
$("#home").onclick=ev=>{ev.preventDefault();state.tab="details";select(null);fitAll(true);};
addEventListener("resize",()=>{const old=fitK;fitK=calcFit(); if(Math.abs(V.k-old)<1e-6) fitAll(false); else {V=clampV(V);apply();}});

sheet.addEventListener("click",ev=>{ const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.goto) select({type:"poi",id:b.dataset.goto}); else if(b.dataset.zone) select({type:"zone",id:b.dataset.zone});
  else if(b.dataset.route) select({type:"route",r:ROUTES.find(r=>r.id===b.dataset.route)}); else if(b.dataset.tabgo){state.tab=b.dataset.tabgo;render();}
  else if(b.dataset.planfrom!=null){plan.from=b.dataset.planfrom;openPlan();} else if(b.dataset.planto!=null){plan.to=b.dataset.planto;openPlan();}
  else if(b.dataset.pf){readPlanInputs();plan.f=b.dataset.pf;savePlan();runPlan();}
  else if(b.dataset.ps){readPlanInputs(); if(b.dataset.ps==="auto"){plan.auto=true;plan.speed=autoSpeed();} else {plan.auto=false;plan.speed=b.dataset.ps;} savePlan(); runPlan();}
  else if(b.id==="homeGo"){plan.from=$("#homeFrom").value;plan.to=$("#homeTo").value;openPlan();}
  else if(b.dataset.ex!=null){const e=EXAMPLES[+b.dataset.ex];plan.from=e[0];plan.to=e[1];plan.f=e[2];savePlan();openPlan();}
  else if(b.id==="planCopy"){const url=location.origin+location.pathname+planHash();const done=()=>{b.textContent="Link copied";setTimeout(()=>{if(b.isConnected)b.textContent="Copy link to this route";},1800);};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,()=>prompt("Copy this link:",url)); else prompt("Copy this link:",url);}
  else if(b.id==="planGo"){readPlanInputs();runPlan();} else if(b.id==="planSwap"){readPlanInputs();[plan.from,plan.to]=[plan.to,plan.from];runPlan();}
  else if(b.id==="planClear"){plan.from=plan.to="";plan.res=null;drawPlan();paint();render();} });
sheet.addEventListener("keydown",ev=>{ if(ev.key!=="Enter") return; if(ev.target.matches("#planFrom,#planTo")){ev.preventDefault();readPlanInputs();runPlan();} else if(ev.target.matches("#homeFrom,#homeTo")){ev.preventDefault();plan.from=$("#homeFrom").value;plan.to=$("#homeTo").value;if(plan.from&&plan.to)openPlan();else(plan.from?$("#homeTo"):$("#homeFrom")).focus();} });
sheet.addEventListener("input",ev=>{ if(ev.target.matches("#planFrom,#planTo")) readPlanInputs(); else if(ev.target.id==="homeFrom") plan.from=ev.target.value; else if(ev.target.id==="homeTo") plan.to=ev.target.value; });
sheet.addEventListener("change",ev=>{ if(ev.target.id==="planFp"){ readPlanInputs(); plan.fp=ev.target.checked; savePlan(); runPlan(); } });
$$(".tabs button").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render();drawPlan();paint();restyle();syncHash();});
$$("[data-layer]").forEach(c=>c.onchange=()=>{state.layers[c.dataset.layer]=c.checked;paint();restyle();});
$("#m-faction").onclick=()=>setMode("faction"); $("#m-level").onclick=()=>setMode("level");
function setMode(m){state.mode=m;$("#m-faction").setAttribute("aria-pressed",m==="faction");$("#m-level").setAttribute("aria-pressed",m==="level");paint();}
$("#lv").addEventListener("input",ev=>{const v=parseInt(ev.target.value,10);state.level=v>=1&&v<=60?v:null;$("#lvclear").hidden=state.level==null;if(plan.auto)plan.speed=autoSpeed();if(state.tab==="plan"){readPlanInputs();if(plan.res)plan.res=computePlan();render();drawPlan();}paint();});
$("#lvclear").onclick=()=>{$("#lv").value="";state.level=null;$("#lvclear").hidden=true;if(plan.auto)plan.speed=autoSpeed();if(state.tab==="plan"){readPlanInputs();if(plan.res)plan.res=computePlan();render();drawPlan();}paint();};

/* search */
const q=$("#q"), res=$("#results"); let hits=[], hi=0;
const INDEX=[...Object.values(ZONES).map(z=>({n:z.name,meta:z.lv?"Zone, "+lvText(z):"Zone",s:{type:"zone",id:z.id},key:(z.name+" "+z.areas.join(" ")).toLowerCase()})),
  ...POIS.map(p=>({n:p.n,meta:TNAME[p.t]+(p.z?", "+ZONES[p.z].name:""),s:{type:"poi",id:p.id},key:p.n.toLowerCase()}))];

function search(){ const v=norm(q.value.trim()); if(!v){res.classList.remove("open");return;}
  const flat=v.replace(/'/g,""); hits=INDEX.map(it=>{const n=norm(it.n),nf=n.replace(/'/g,"");let sc=-1; if(nf.startsWith(flat))sc=3;else if(nf.split(/\s+/).some(w=>w.startsWith(flat)))sc=2;else if(nf.includes(flat))sc=1;else if(it.key.replace(/'/g,"").includes(flat))sc=.5;return{it,sc};}).filter(h=>h.sc>0).sort((a,b)=>b.sc-a.sc||a.it.n.localeCompare(b.it.n)).slice(0,9).map(h=>h.it);
  hi=0; res.innerHTML=hits.length?hits.map((h,i)=>`<button role="option" data-i="${i}" aria-selected="${i===0}"><span class="r-name">${esc(h.n)}</span><span class="r-meta">${esc(h.meta)}</span></button>`).join(""):`<div class="empty">Nothing on the map matches "${esc(q.value)}". Try a zone, town or dungeon name.</div>`;
  res.classList.add("open"); }
function pick(i){ const h=hits[i]; if(!h) return; res.classList.remove("open"); q.value=h.n; q.blur(); select(h.s); }
q.addEventListener("input",search); q.addEventListener("focus",search);
q.addEventListener("keydown",ev=>{ if(ev.key==="ArrowDown"||ev.key==="ArrowUp"){ev.preventDefault(); if(!hits.length)return; hi=(hi+(ev.key==="ArrowDown"?1:hits.length-1))%hits.length; [...res.children].forEach((c,i)=>{c.setAttribute("aria-selected",i===hi); if(i===hi)c.scrollIntoView({block:"nearest"});});}
  else if(ev.key==="Enter"){ev.preventDefault();pick(hi);} else if(ev.key==="Escape"){res.classList.remove("open");q.blur();} });
res.addEventListener("pointerdown",ev=>{const b=ev.target.closest("button"); if(b){ev.preventDefault();pick(+b.dataset.i);}});
document.addEventListener("pointerdown",ev=>{ if(!ev.target.closest(".search")) res.classList.remove("open"); });
document.addEventListener("keydown",ev=>{ if(ev.key==="/"&&document.activeElement!==q&&!/input/i.test(document.activeElement.tagName)){ev.preventDefault();q.focus();} else if(ev.key==="Escape"&&document.activeElement!==q){select(null,{keepTab:true});} });

/* init */
if(innerWidth<860) $("#key").removeAttribute("open");
$("#key").addEventListener("toggle",()=>{const atFit=Math.abs(V.k-fitK)<1e-6; fitK=calcFit(); if(atFit) fitAll(true);});
paint(); fitAll(false); render();
if(loadHash()) openPlan();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>restyle());
})();
</script>
